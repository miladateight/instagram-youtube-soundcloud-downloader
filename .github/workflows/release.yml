name: release

# Publishes the container image for a tagged version to GitHub's own registry,
# together with a bill of materials and a signed statement of where the image
# was built. For this project that provenance is the whole trust story: there
# is no installer to code-sign, so what a self-hoster can verify instead is
# that the image they are about to run came out of this repository at this
# commit.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write       # push to ghcr.io
  id-token: write       # sign the provenance statement
  attestations: write   # record it against this repository

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag matches the declared version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [ "$tag" != "$declared" ]; then
            echo "Tag is $tag but pyproject.toml says $declared." >&2
            exit 1
          fi
          echo "Releasing $tag."

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 also publishes 1.2, 1 and latest, so a compose file can pin as
      # loosely or as tightly as its owner wants.
      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # amd64 only for now. shazamio's native core has no prebuilt aarch64
      # wheel for this base image, so an arm64 build compiles it under QEMU
      # and takes the better part of an hour when it succeeds at all.
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verifiable with:
      #   gh attestation verify oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
      #     --repo ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
